<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qui est la Queen 👑</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

<!-- HOME -->
<section id="screen-home" class="screen active">

  <div class="container">

    <div class="emoji">👑</div>

    <h1>Qui est la Queen ?</h1>

    <p class="subtitle">
      Version chaos 🍸
    </p>

    <button id="btn-start" class="btn-primary">
      Commencer 🚀
    </button>

    <button id="btn-manage" class="btn-secondary">
      👥 Liste des joueuses
    </button>

  </div>

</section>

<!-- SECRET -->
<section id="screen-secret" class="screen">

  <div class="container">

    <div id="secret-avatar" class="big-avatar"></div>

    <h2 id="secret-name"></h2>

    <p id="secret-anecdote"></p>

    <button id="btn-secret-ok" class="btn-primary">
      J'ai vu 👀
    </button>

  </div>

</section>

<!-- GAME -->
<section id="screen-game" class="screen">

  <header>

    <button id="btn-home" class="icon-btn">
      🏠
    </button>

    <button id="btn-show-secret" class="icon-btn">
      👁️
    </button>

  </header>

  <div id="cards-grid" class="cards-grid"></div>

  <div class="bottom-zone">

    <div class="question-card">
      <p id="question-text">
        Clique pour une question 🎲
      </p>
    </div>

    <button id="btn-question" class="btn-secondary">
      Nouvelle question
    </button>

    <button id="btn-guess" class="btn-primary">
      Je devine 🎯
    </button>

  </div>

</section>

<!-- WIN -->
<section id="screen-win" class="screen">

  <div class="container">

    <div class="emoji">🏆</div>

    <div id="win-avatar" class="big-avatar"></div>

    <h2 id="win-name"></h2>

    <button id="btn-replay" class="btn-primary">
      Rejouer 🔄
    </button>

  </div>

</section>

<!-- LOSE -->
<section id="screen-lose" class="screen">

  <div class="container">

    <div class="emoji">😬</div>

    <div id="lose-avatar" class="big-avatar"></div>

    <h2 id="lose-name"></h2>

    <button id="btn-replay2" class="btn-primary">
      Rejouer 🔄
    </button>

  </div>

</section>

<!-- GUESS MODAL -->
<div id="modal-guess" class="modal hidden">

  <div class="modal-box">

    <h2>Qui est-ce ? 🎯</h2>

    <div id="guess-grid" class="guess-grid"></div>

  </div>

</div>

<!-- PLAYERS MODAL -->
<div id="modal-players" class="modal hidden">

  <div class="modal-box players-box">

    <div class="players-header">

      <h2>👥 Joueuses</h2>

      <button id="btn-close-players" class="icon-btn">
        ✕
      </button>

    </div>

    <div id="players-list"></div>

    <button id="btn-add-player" class="floating-btn">
      +
    </button>

  </div>

</div>

<!-- FORM MODAL -->
<div id="modal-form" class="modal hidden">

  <div class="modal-box">

    <h2 id="form-title">
      Ajouter une joueuse
    </h2>

    <input
      type="text"
      id="input-name"
      class="input"
      placeholder="Prénom"
    >

    <textarea
      id="input-anecdote"
      class="input"
      placeholder="Anecdote"
    ></textarea>

    <!-- IMPORTANT -->
    <!-- PAS de capture=environment -->
    <!-- comme ça : -->
    <!-- téléphone = caméra OU galerie -->

    <input
      type="file"
      id="input-photo"
      accept="image/*"
      hidden
    >

    <button id="btn-photo" class="btn-secondary">
      📸 Ajouter une photo
    </button>

    <div id="photo-preview"></div>

    <button id="btn-save-player" class="btn-primary">
      Sauvegarder ✅
    </button>

    <button id="btn-cancel-player" class="btn-secondary">
      Annuler
    </button>

  </div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="script.js"></script>

</body>
</html>
